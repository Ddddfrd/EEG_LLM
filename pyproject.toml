[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-llm"
version = "0.1.0"
description = "EEGMamba visual tokens fused with Qwen LoRA and E2 features"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "pyedflib==0.1.42",
    "transformers==4.49.0",
]

[tool.setuptools]
py-modules = ["project_config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
